<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — BrahmnMitra</title>
<meta name="theme-color" content="#04060C">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:Archivo,system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#04060C 0%,#0B1526 55%,#14243F 100%);
    color:#EAF2FF;display:grid;place-items:center;min-height:100svh;padding:24px;text-align:center;
  }
  .card{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border-radius:28px;padding:52px 40px;max-width:520px;
    box-shadow:0 24px 60px -22px rgba(0,0,0,.6);
  }
  .code{font-weight:900;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#FFB347;margin-bottom:18px}
  h1{font-size:1.6rem;margin-bottom:14px;line-height:1.3}
  p{color:#B9C9E2;line-height:1.7;margin-bottom:8px}
  .actions{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14.5px;
    padding:13px 26px;border-radius:999px;min-height:44px;transition:transform .2s ease;
  }
  a.btn:focus-visible{outline:2px solid #FFB347;outline-offset:3px}
  a.btn:hover{transform:translateY(-1px)}
  .btn-amber{background:linear-gradient(160deg,#FFC670,#FFB347 45%,#FF9E2C);color:#2A1600}
  .btn-glass{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#EAF2FF}
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>This page took a different flight.</h1>
    <p>The page you're looking for doesn't exist, or the link may be out of date.</p>
    <p>Here's how to get back on course:</p>
    <div class="actions">
      <a class="btn btn-amber" href="/">Back to Home</a>
      <a class="btn btn-glass" href="/#contact">Contact Us</a>
    </div>
  </div>
</body>
</html>
