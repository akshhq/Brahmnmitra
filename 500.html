<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Something went wrong — BrahmnMitra</title>
    <meta name="theme-color" content="#04060C" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          Archivo,
          system-ui,
          -apple-system,
          sans-serif;
        background: linear-gradient(
          180deg,
          #04060c 0%,
          #0b1526 55%,
          #14243f 100%
        );
        color: #eaf2ff;
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border-radius: 28px;
        padding: 52px 40px;
        max-width: 520px;
        box-shadow: 0 24px 60px -22px rgba(0, 0, 0, 0.6);
      }
      .code {
        font-weight: 900;
        font-size: 15px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #ffb347;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 14px;
        line-height: 1.3;
      }
      p {
        color: #b9c9e2;
        line-height: 1.7;
        margin-bottom: 8px;
      }
      .actions {
        margin-top: 30px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        font-weight: 700;
        font-size: 14.5px;
        padding: 13px 26px;
        border-radius: 999px;
        min-height: 44px;
        transition: transform 0.2s ease;
      }
      a.btn:focus-visible {
        outline: 2px solid #ffb347;
        outline-offset: 3px;
      }
      a.btn:hover {
        transform: translateY(-1px);
      }
      .btn-amber {
        background: linear-gradient(160deg, #ffc670, #ffb347 45%, #ff9e2c);
        color: #2a1600;
      }
      .btn-glass {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #eaf2ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">500</p>
      <h1>Something went wrong on our end.</h1>
      <p>
        This isn't you — our server hit a snag. It's already logged and we'll
        take a look.
      </p>
      <p>
        In the meantime, call or WhatsApp us directly and we'll pick it up from
        there.
      </p>
      <div class="actions">
        <a class="btn btn-amber" href="tel:+919211761885"
          >Call +91 92117 61885</a
        >
        <a
          class="btn btn-glass"
          href="https://wa.me/919211761885"
          target="_blank"
          rel="noopener"
          >WhatsApp</a
        >
      </div>
    </div>
  </body>
</html>
